# SPDX-License-Identifier: MIT
#
# Composite Action skeleton for `JosiahSiegel/umactually-action`.
#
# This file is committed in the CLI repo for review and to unblock the
# drift / schema tests. The published copy will live at
# github.com/JosiahSiegel/umactually-action once the separate repo is
# bootstrapped (plan T10 — an external human gate that this repo
# acknowledges as out-of-scope).
#
# Branch-protection contract:
#   - Output `verdict`: success / failure verdict for required checks.
#   - Output `inline-thread-count`: number of inline threads posted.
#   - Output `review-id`: the run's review identifier.
# These three outputs are what branch-protection rules branch on.
#
# Secret forwarding contract:
#   Per docs.github.com/en/actions/reference/workflows-and-actions/contexts:
#   "this context [secrets] is not available to composite actions;
#    secrets must be passed to composite actions explicitly as inputs."
#   The action's `api-url` / `api-key` inputs are the canonical
#   Composite Action pattern for forwarding secrets. Calling workflows
#   MUST pass them via `with:` (not via a `secrets:` block on `uses:`,
#   which is a JavaScript/Docker action pattern and not supported here):
#     with:
#       api-url: ${{ secrets.UMACTUALLY_API_URL }}
#       api-key: ${{ secrets.UMACTUALLY_API_KEY }}
#   Defaults are the empty string `""` (avoids a truthy literal
#   `"${{ secrets.* }}"` placeholder that would silently bypass the
#   bootstrap).
#
# First-run secret bootstrap behavior:
#   The `bootstrap-secret-pr-comment` step detects a missing
#   `secrets.UMACTUALLY_API_URL` or `secrets.UMACTUALLY_API_KEY` on an
#   opening/reopening PR event and posts an idempotent PR comment
#   (marker `<!-- umactually-bootstrap -->`) explaining the two
#   secrets the operator must add. On `synchronize` the step is a
#   no-op (one comment per PR). The step queries existing comments
#   for the marker before posting, so reopened PRs that already carry
#   the bootstrap comment are not spammed. The step then exits with
#   the typed error code `UMACTUALLY_ERR_SECRET_BOOTSTRAP` (3) so a
#   branch-protection rule can surface the bootstrap requirement as a
#   required status check failure. See
#   `docs/install-action.md#first-run-secret-bootstrap` for the
#   long form and `src/util/exit-codes.ts` for the literal.
#
# Supply-chain integrity:
#   Pin `uses:` to a full commit SHA (e.g. `@317613a... # v1`) for
#   integrity. Floating `@v1` accepts any future tag the action repo
#   publishes; a compromised repo gets to run arbitrary code in this
#   workflow with `pull-requests: write`. SHA-pin + Dependabot's
#   `github-actions` ecosystem auto-updates to the latest tagged commit
#   without hand edits.
name: "UmActually PR review"
description: "AI PR review as a Composite GitHub Action. Node 24 setup, CLI install, first-run secret bootstrap, verdict output."
author: "Josiah Siegel <https://github.com/JosiahSiegel>"
branding:
  icon: "check-circle"
  color: "blue"
inputs:
  cli-version:
    description: "Version of the `umactually` CLI to install via `npm install -g`. Default is a placeholder that `umactually init` replaces with the current CLI version. Pin a specific version (e.g. `0.10.1`) if not using the wizard."
    required: false
    default: "__UMACTUALLY_VERSION__"
  api-url:
    description: "API base URL for the configured provider family. Forwarded to the CLI as `UMACTUALLY_API_URL`. Default is empty — the calling workflow forwards the secret via `with: api-url: secrets.UMACTUALLY_API_URL` (Composite Actions cannot access the `secrets.` context; passing via a `secrets:` block on `uses:` is not supported)."
    required: false
    default: ""
  api-key:
    description: "Provider API key. Forwarded to the CLI as `UMACTUALLY_API_KEY`. Default is empty — the calling workflow forwards the secret via `with: api-key: secrets.UMACTUALLY_API_KEY` (Composite Actions cannot access the `secrets.` context; passing via a `secrets:` block on `uses:` is not supported). Never place the credential in YAML literals or command arguments."
    required: false
    default: ""
  provider:
    description: "Provider family. One of `openai-compatible`, `anthropic`, or `copilot`. Default `openai-compatible` — the wizard's pick for the most common operator profile."
    required: false
    default: "openai-compatible"
  model:
    description: "Provider-specific model identifier (optional). Empty string = let the provider pick its default model (e.g. OpenAI's `gpt-4o`, Anthropic's `claude-sonnet-4-5`)."
    required: false
    default: ""
  config-path:
    description: "Path to the committed `umactually.review.json` policy file (schemaVersion 1). Default `./umactually.review.json` — the wizard's default path; auto-discovery walks up to the repo root."
    required: false
    default: "./umactually.review.json"
  output-artifact:
    description: "Path the CLI writes the review artifact to. Default `umactually-review.json`. Exposed as a step output and uploaded via `actions/upload-artifact@v4` in the action's final step for downstream consumers."
    required: false
    default: "umactually-review.json"
  skip-draft:
    description: "When `'true'`, the CLI skips re-reviewing files whose inline threads haven't changed since the last run. Default `'true'` matches the wizard's default (cost-aware incremental review)."
    required: false
    default: "true"
  paths-ignore:
    description: "Comma-separated gitignore-style globs the CLI excludes from review. Default excludes Markdown docs and lock files — neither is reviewable code. Pass an empty string to review every file."
    required: false
    default: "**/*.md,docs/**,**/*.lock"
outputs:
  verdict:
    description: "Success/failure verdict for required status checks. `success` when the review posted without a parse-fail sentinel; `failure` otherwise. Branch-protection rules branch on this output."
  inline-thread-count:
    description: "Number of inline review threads posted to the PR. Zero is a successful clean review. Surfaced as a job summary for human reviewers."
  review-id:
    description: "Opaque run identifier (request id) emitted by the CLI in the review artifact's `metadata.requestId` field. Used for log correlation."
runs:
  using: "composite"
  steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js 24
      uses: actions/setup-node@v7
      with:
        node-version: "24"

    - name: Install umactually CLI
      shell: bash
      # Exit 1 (NOT 3): an un-substituted `__UMACTUALLY_VERSION__`
      # placeholder is a packaging bug, not a missing-secrets failure.
      # Branch-protection rules branch on exit 3 for
      # `UMACTUALLY_ERR_SECRET_BOOTSTRAP` and would mis-attribute this
      # packaging failure to missing secrets. The
      # `UMACTUALLY_ERR_CLI_VERSION_UNRESOLVED` log is a `::error::`
      # string only — it is intentionally NOT a new numeric exit code.
      run: |
        if [ "${{ inputs.cli-version }}" = "__UMACTUALLY_VERSION__" ]; then
          echo "::error::UMACTUALLY_ERR_CLI_VERSION_UNRESOLVED — cli-version is the un-substituted wizard placeholder; pin it to a CLI version (e.g. \`0.10.1\`) or regenerate the workflow via \`umactually init\`."
          exit 1
        fi
        npm install -g "umactually@${{ inputs.cli-version }}"

    - name: First-run secret bootstrap (idempotent PR comment + typed exit code 3)
      id: bootstrap
      shell: bash
      env:
        # Composite Actions cannot access the `secrets.` context — the
        # calling workflow MUST forward via `with:` (see header comment).
        UMACTUALLY_API_URL: ${{ inputs.api-url }}
        UMACTUALLY_API_KEY: ${{ inputs.api-key }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        if [ -z "$UMACTUALLY_API_URL" ] || [ -z "$UMACTUALLY_API_KEY" ]; then
          # Idempotency contract: only post the bootstrap comment on the
          # PR-opening family of events (`opened` / `reopened` /
          # `ready_for_review`). On `synchronize` the step is a no-op for
          # the comment post. Even on the opening-family events, we first
          # query existing comments for the marker `<!-- umactually-bootstrap -->`
          # and skip the post if one already carries it — defeating
          # duplicate posts on reopened PRs that previously bootstrapped.
          # The marker string MUST stay byte-identical (see
          # `docs/install-action.md` § First-run secret bootstrap).
          if [ "${{ github.event_name }}" = "pull_request" ] && { [ "${{ github.event.action }}" = "opened" ] || [ "${{ github.event.action }}" = "reopened" ] || [ "${{ github.event.action }}" = "ready_for_review" ]; }; then
            MARKER="<!-- umactually-bootstrap -->"
            PR_NUMBER="${{ github.event.pull_request.number }}"
            EXISTING=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" --jq '.[] | .body' 2>/dev/null | grep -F "$MARKER" || true)
            if [ -z "$EXISTING" ]; then
              cat > /tmp/umactually-bootstrap-body.md <<'BOOTSTRAP_EOF'
        <!-- umactually-bootstrap -->
        ## umactually: secret bootstrap required

        The umactually action needs two repository secrets before it can run a review:

        1. `UMACTUALLY_API_URL` — your provider's API base URL.
        2. `UMACTUALLY_API_KEY` — your provider's API key.

        Configure them under **Settings → Secrets and variables → Actions** on this repository. The action re-runs on the next `synchronize` event once both secrets are present.

        See `docs/install-action.md` for the long form.
        BOOTSTRAP_EOF
              gh pr comment "$PR_NUMBER" --body-file /tmp/umactually-bootstrap-body.md || true
              rm -f /tmp/umactually-bootstrap-body.md
            fi
          fi
          echo "::error::UMACTUALLY_ERR_SECRET_BOOTSTRAP — secrets.UMACTUALLY_API_URL or secrets.UMACTUALLY_API_KEY is empty."
          exit 3
        fi

    - name: Run umactually PR review
      id: review
      shell: bash
      env:
        # Composite Actions cannot access the `secrets.` context — the
        # calling workflow MUST forward via `with:` (see header comment).
        UMACTUALLY_API_URL: ${{ inputs.api-url }}
        UMACTUALLY_API_KEY: ${{ inputs.api-key }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        # Forward --provider unconditionally (it always has a default).
        # Forward --model ONLY when non-empty, so the action's default
        # empty string does not override the wizard's saved config when
        # the operator didn't explicitly set a per-run model.
        # The review subcommand auto-discovers `umactually.review.json`
        # from the cwd (no --config-path needed); incremental review is
        # per-PR via GitHub thread queries (no --skip-draft flag exists);
        # path filtering uses --files and the diff's own ignore list
        # (no --paths-ignore flag exists). The action retains the
        # corresponding inputs in its contract for wizard compatibility.
        MODEL_ARGS=()
        if [ -n "${{ inputs.model }}" ]; then
          MODEL_ARGS+=(--model "${{ inputs.model }}")
        fi
        umactually review \
          --platform github \
          --output-artifact "${{ inputs.output-artifact || 'umactually-review.json' }}" \
          --provider "${{ inputs.provider }}" \
          "${MODEL_ARGS[@]}"

    - name: Upload review artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: umactually-review
        path: ${{ inputs.output-artifact || 'umactually-review.json' }}
        if-no-files-found: warn

    - name: Emit branch-protection outputs
      if: always()
      id: outputs
      shell: bash
      run: |
        set -e
        ARTIFACT="${{ inputs.output-artifact || 'umactually-review.json' }}"
        if [ -f "$ARTIFACT" ]; then
          VERDICT=$(node -e "const j=require('./$ARTIFACT');process.stdout.write(j.verdict||'success')")
          COUNT=$(node -e "const j=require('./$ARTIFACT');process.stdout.write(String(j.inlineThreadCount??0))")
          REVIEW_ID=$(node -e "const j=require('./$ARTIFACT');process.stdout.write(j.metadata?.requestId||j.reviewId||'')")
        else
          VERDICT="failure"
          COUNT="0"
          REVIEW_ID=""
        fi
        echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"
        echo "inline-thread-count=$COUNT" >> "$GITHUB_OUTPUT"
        echo "review-id=$REVIEW_ID" >> "$GITHUB_OUTPUT"